name: Construir web

# Se dispara cuando el panel web publica contenido o sube un vídeo nuevo.
# Regenera index.html y re-codifica el vídeo del hero a all-intra con ffmpeg.

on:
  push:
    branches: [main]
    paths:
      - 'panel/data/content.json'
      - 'assets/raw/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: construir-web
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Re-codificar vídeos del hero (all-intra) si hay nuevos
        run: |
          shopt -s nullglob
          mkdir -p assets/video

          # El scroll-scrub busca frames sin parar: cada frame tiene que ser
          # keyframe (all-intra) o el seeking va a saltos.
          # $1 origen · $2 destino · $3 ancho máximo · $4 CRF
          recodificar () {
            echo "Re-codificando $1 -> $2 (todo keyframes)…"
            ffmpeg -y -i "$1" -an -c:v libx264 -preset medium -crf "$4" \
              -g 1 -keyint_min 1 -bf 0 -pix_fmt yuv420p \
              -vf "scale=min($3\,iw):-2,fps=30" -movflags +faststart "$2"
          }

          # Horizontal (escritorio). 1280px/CRF24: all-intra dispara el bitrate
          # y por encima de esto el vídeo ya no llega a cargar en la web.
          horiz=(assets/raw/hero-source.*)
          if [ ${#horiz[@]} -gt 0 ]; then
            recodificar "${horiz[0]}" assets/video/hero-scrub.mp4 1280 24
            rm -f "${horiz[@]}"
          else
            echo "Sin vídeo horizontal nuevo."
          fi

          # Vertical 9:16 (móvil). 720px de ancho = los mismos píxeles por
          # frame que el horizontal; CRF28 porque el encuadre vertical tiene
          # mucho más detalle y si no se va a 14 MB.
          vert=(assets/raw/hero-source-vertical.*)
          if [ ${#vert[@]} -gt 0 ]; then
            recodificar "${vert[0]}" assets/video/hero-scrub-vertical.mp4 720 28
            rm -f "${vert[@]}"
          else
            echo "Sin vídeo vertical nuevo."
          fi

      - name: Regenerar index.html
        run: node panel/build.js

      - name: Publicar cambios
        run: |
          git config user.name "panel-bot"
          git config user.email "panel-bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nada que publicar."
          else
            git commit -m "Web regenerada [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
